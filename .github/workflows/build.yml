name: Build dictionary

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      PYTHONUNBUFFERED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Check out converter
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: work/hydcd-yomitan/requirements-lock.txt

      - name: Install locked dependencies
        run: python -m pip install -r work/hydcd-yomitan/requirements-lock.txt

      - name: Test converter
        timeout-minutes: 5
        working-directory: work/hydcd-yomitan
        run: python -m pytest

      - name: Download and verify private source inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/fetch_inputs.py

      - name: Build dictionary
        timeout-minutes: 15
        working-directory: work/hydcd-yomitan
        env:
          HYDCD_RELEASE_REVISION: 2025.12.13.${{ github.run_number }}.${{ github.run_attempt }}
        run: python -m hydcd_yomitan build --input ../input/hydcd-seven --output ../../outputs/hydcd-qiding-yomitan.zip

      - name: Validate every bank without recursive term-schema validation
        timeout-minutes: 10
        working-directory: work/hydcd-yomitan
        run: python -m hydcd_yomitan validate ../../outputs/hydcd-qiding-yomitan.zip --archive-only --report ../../outputs/validation-report.txt

      - name: Build Light dictionary
        timeout-minutes: 15
        working-directory: work/hydcd-yomitan
        env:
          HYDCD_RELEASE_REVISION: 2025.12.13.${{ github.run_number }}.${{ github.run_attempt }}
        run: python -m hydcd_yomitan build --input ../input/hydcd-seven --edition light --output ../../outputs/hydcd-qiding-yomitan-light.zip

      - name: Validate every Light bank and enforce content removals
        timeout-minutes: 10
        working-directory: work/hydcd-yomitan
        run: python -m hydcd_yomitan validate ../../outputs/hydcd-qiding-yomitan-light.zip --edition light --archive-only --report ../../outputs/validation-light-report.txt

      - name: Compare editions and prepare update indexes, sizes, provenance, and checksums
        timeout-minutes: 10
        run: python .github/scripts/prepare_release.py

      - name: Upload dictionary and reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hydcd-yomitan-${{ github.sha }}
          path: |
            outputs/hydcd-qiding-yomitan.zip
            outputs/index.json
            outputs/hydcd-qiding-conversion-report.json
            outputs/validation-report.txt
            outputs/hydcd-qiding-yomitan-light.zip
            outputs/index-light.json
            outputs/hydcd-qiding-light-conversion-report.json
            outputs/validation-light-report.txt
            outputs/edition-comparison.json
            outputs/release-notes.md
            outputs/build-info.json
            outputs/SHA256SUMS
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download validated dictionary and reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: hydcd-yomitan-${{ github.sha }}
          path: outputs

      - name: Verify dictionary checksum
        working-directory: outputs
        run: sha256sum --check SHA256SUMS

      - name: Publish dictionary release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          revision="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("outputs/index.json").read_text(encoding="utf-8"))["revision"])')"
          gh release create "$tag" \
            outputs/hydcd-qiding-yomitan.zip \
            outputs/index.json \
            outputs/hydcd-qiding-conversion-report.json \
            outputs/validation-report.txt \
            outputs/hydcd-qiding-yomitan-light.zip \
            outputs/index-light.json \
            outputs/hydcd-qiding-light-conversion-report.json \
            outputs/validation-light-report.txt \
            outputs/edition-comparison.json \
            outputs/build-info.json \
            outputs/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --latest \
            --title "HYDCD Qiding build ${revision}" \
            --notes-file outputs/release-notes.md
