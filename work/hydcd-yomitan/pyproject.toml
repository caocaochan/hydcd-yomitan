[build-system]
requires = ["setuptools==80.9.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hydcd-yomitan"
version = "1.0.5"
description = "Private converter for the Hanyu Da Cidian Qiding MDict fork"
requires-python = ">=3.12"
dependencies = [
    "jsonschema==4.25.1",
    "lxml==6.0.2",
    "mdict-utils==1.3.14",
    "Pillow==12.2.0",
    "psutil==7.2.2",
    "resvg_py==0.3.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.package-data]
hydcd_yomitan = ["schemas/*.json", "data/*.json", "data/*.css"]
